<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reseller Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --primary-color: #00d2d3;
      --glow-color: rgba(0, 210, 211, 0.45);
      --card-bg: rgba(12, 16, 24, 0.9);
      --bg-dark: #030508;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
    body { min-height: 100vh; background: var(--bg-dark); color: #fff; position: relative; overflow-x: hidden; }
    #fxCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    .login-wrapper {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center; z-index: 10;
      padding: 15px;
    }
    .login-card {
      width: 100%; max-width: 360px; background: var(--card-bg);
      border: 1.5px solid var(--primary-color); border-radius: 20px;
      padding: 30px 24px; text-align: center; backdrop-filter: blur(12px);
      box-shadow: 0 0 25px var(--glow-color);
    }
    .login-icon {
      width: 60px; height: 60px; margin: 0 auto 16px;
      border: 1.5px solid var(--primary-color); border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 24px; color: var(--primary-color);
    }

    .dash-container { position: relative; z-index: 10; max-width: 950px; margin: 0 auto; padding: 18px 12px 60px; display: none; }
    .nav-header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 14px 20px; border-radius: 14px;
      border: 1.5px solid var(--primary-color); box-shadow: 0 0 18px var(--glow-color);
      margin-bottom: 18px;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card {
      background: var(--card-bg); border: 1.2px solid var(--primary-color);
      border-radius: 14px; padding: 14px; text-align: center;
    }
    .stat-card h4 { font-size: 10.5px; color: #aaa; text-transform: uppercase; margin-bottom: 6px; }
    .stat-card p { font-size: 20px; font-weight: 800; color: #fff; }

    .card { background: var(--card-bg); border: 1.5px solid var(--primary-color); border-radius: 16px; padding: 22px; margin-bottom: 20px; }
    .card-title {
      font-size: 14.5px; color: #fff; margin-bottom: 16px; font-weight: 700;
      display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 10px;
    }

    label { font-size: 11px; color: #aaa; text-transform: uppercase; display: block; margin-bottom: 6px; font-weight: bold; }
    input, select {
      width: 100%; padding: 12px 14px; margin-bottom: 14px;
      background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px; color: #fff; outline:none; font-size: 13px;
    }

    .custom-input-group { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .custom-input-group input { margin-bottom: 0; flex: 1.2; text-align: center; }
    .custom-input-group select { margin-bottom: 0; flex: 1.8; }

    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-weight: 800; cursor: pointer; text-transform: uppercase;
      background: var(--primary-color); color: #000; font-size: 12.5px;
      transition: all 0.25s; box-shadow: 0 0 15px var(--glow-color);
    }
    .btn-danger { background: #ff4757; color: #fff; }
    .btn-warning { background: #ffa502; color: #000; }

    .table-container { overflow-x: auto; margin-top: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th, td { padding: 11px; border-bottom: 1px solid rgba(255,255,255,0.07); }
    th { background: rgba(255,255,255,0.05); color: var(--primary-color); }
  </style>
</head>
<body>

  <canvas id="fxCanvas"></canvas>

  <div class="login-wrapper" id="loginWrapper">
    <div class="login-card">
      <div class="login-icon"><i class="fa-solid fa-user-shield"></i></div>
      <h2 style="font-size: 18px; letter-spacing: 1.5px; margin-bottom: 6px;">RESELLER ACCESS</h2>
      <p style="font-size: 11px; color: #888; margin-bottom: 20px;">// LOGIN TO MANAGE KEYS</p>

      <label style="text-align: left;">Username</label>
      <input type="text" id="rUser" placeholder="Enter username">
      <label style="text-align: left;">Password</label>
      <input type="password" id="rPass" placeholder="Enter password">
      <button class="btn" onclick="resellerLogin()"><i class="fa-solid fa-right-to-bracket"></i> Login Dashboard</button>
    </div>
  </div>

  <div class="dash-container" id="dashContainer">
    <div class="nav-header">
      <h2>RESELLER: <span id="curReseller" style="color:var(--primary-color)"></span></h2>
      <button onclick="resellerLogout()" style="background:none; border: 1px solid #ff4757; color:#ff4757; padding: 6px 14px; border-radius: 8px; cursor:pointer; font-weight:bold;">
        Logout
      </button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><h4>Balance Credits</h4><p id="statCredits" style="color: #2ed573;">0</p></div>
      <div class="stat-card"><h4>Active Live Now</h4><p id="statLiveUsers" style="color: var(--primary-color);">0</p></div>
      <div class="stat-card"><h4>Total Created</h4><p id="statTotalKeys">0</p></div>
      <div class="stat-card"><h4>Frozen Keys</h4><p id="statFrozenKeys" style="color: #70a1ff;">0</p></div>
    </div>

    <!-- Live Users -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-tower-broadcast" style="color:#2ed573;"></i> Active Users on My Keys</div>
      <div class="table-container">
        <table>
          <thead><tr><th>Key</th><th>Device</th><th>Time</th><th>Status</th></tr></thead>
          <tbody id="rLiveUsersBody"><tr><td colspan="4" style="text-align:center; color:#888;">No active users</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Create Key -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-key"></i> Generate Key (Cost: 1 Credit)</div>
      <label>Custom Key (Optional)</label>
      <input type="text" id="rCustomKey" placeholder="Leave blank for auto key">
      
      <label>Device Policy</label>
      <select id="rPolicy">
        <option value="one">Single Device (Locked)</option>
        <option value="unlimited">Unlimited Devices</option>
      </select>

      <label>Duration</label>
      <div class="custom-input-group">
        <input type="number" id="rCustomNum" min="1" value="1">
        <select id="rCustomUnit">
          <option value="seconds">Seconds</option>
          <option value="minutes">Minutes</option>
          <option value="hours">Hours</option>
          <option value="days" selected>Days</option>
          <option value="months">Months (30d)</option>
          <option value="years">Years (365d)</option>
        </select>
      </div>
      <button class="btn" onclick="resellerGenKey()"><i class="fa-solid fa-bolt"></i> Generate Key</button>
    </div>

    <!-- Keys List -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-list-check"></i> My Generated Keys</div>
      <div class="table-container">
        <table>
          <thead><tr><th>Key</th><th>Duration</th><th>Device Bound</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="rKeyRows"><tr><td colspan="5" style="text-align:center; color:#888;">No keys found</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBoKzvChahaiWrPMqv_WgAhnSycCiOFHCI",
      databaseURL: "https://death-portal-cf194-default-rtdb.firebaseio.com",
      projectId: "death-portal-cf194"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let loggedReseller = null;
    let resellerCredits = 0;
    let myKeys = new Set();

    window.addEventListener("DOMContentLoaded", () => {
      const u = localStorage.getItem("dp_reseller_user");
      const p = localStorage.getItem("dp_reseller_pass");
      if (u && p) {
        document.getElementById("rUser").value = u;
        document.getElementById("rPass").value = p;
        resellerLogin();
      }
    });

    function resellerLogin() {
      const u = document.getElementById("rUser").value.trim();
      const p = document.getElementById("rPass").value.trim();
      if(!u || !p) return;

      db.ref("RESELLERS/" + u).once("value", snapshot => {
        if(snapshot.exists() && snapshot.val().pass === p) {
          loggedReseller = u;
          localStorage.setItem("dp_reseller_user", u);
          localStorage.setItem("dp_reseller_pass", p);

          document.getElementById("loginWrapper").style.display = "none";
          document.getElementById("dashContainer").style.display = "block";
          document.getElementById("curReseller").innerText = loggedReseller;
          initDashboard();
        } else {
          alert("Invalid Reseller Credentials!");
        }
      });
    }

    function resellerLogout() {
      localStorage.removeItem("dp_reseller_user");
      localStorage.removeItem("dp_reseller_pass");
      location.reload();
    }

    function initDashboard() {
      db.ref("RESELLERS/" + loggedReseller + "/credits").on("value", snapshot => {
        resellerCredits = snapshot.val() || 0;
        document.getElementById("statCredits").innerText = resellerCredits;
      });

      db.ref("DEATHPORTAL").orderByChild("createdBy").equalTo(loggedReseller).on("value", snapshot => {
        const tbody = document.getElementById("rKeyRows");
        tbody.innerHTML = "";
        let total = 0, frozen = 0;
        myKeys.clear();

        if(snapshot.exists()) {
          snapshot.forEach(child => {
            total++;
            const key = child.key;
            const data = child.val();
            myKeys.add(key);
            if(data.isFrozen) frozen++;

            tbody.innerHTML += `
              <tr>
                <td><b>${key}</b></td>
                <td>${data.durationText}</td>
                <td><small style="color:#aaa;">${data.boundDevice || "Unregistered"}</small></td>
                <td>${data.isFrozen ? "<span style='color:#70a1ff;'>Frozen</span>" : "<span style='color:#2ed573;'>Active</span>"}</td>
                <td>
                  <button class="btn btn-warning" style="padding:4px 8px; font-size:11px; width:auto;" onclick="toggleFreeze('${key}', ${!data.isFrozen})">${data.isFrozen ? 'Unfreeze' : 'Freeze'}</button>
                  <button class="btn btn-danger" style="padding:4px 8px; font-size:11px; width:auto;" onclick="deleteResellerKey('${key}', '${data.durationText}')">Del</button>
                </td>
              </tr>`;
          });
        }
        document.getElementById("statTotalKeys").innerText = total;
        document.getElementById("statFrozenKeys").innerText = frozen;
      });

      db.ref("ONLINE_USERS").on("value", snapshot => {
        const liveTbody = document.getElementById("rLiveUsersBody");
        liveTbody.innerHTML = "";
        let liveCount = 0;

        if (snapshot.exists()) {
          snapshot.forEach(child => {
            const user = child.val();
            if (user.usedKey && myKeys.has(user.usedKey)) {
              liveCount++;
              liveTbody.innerHTML += `
                <tr>
                  <td><b>${user.usedKey}</b></td>
                  <td>${user.deviceModel || "Android"}</td>
                  <td>${user.connectedAt ? new Date(user.connectedAt).toLocaleTimeString() : "Just now"}</td>
                  <td><span style="color:#2ed573;">● Online</span></td>
                </tr>`;
            }
          });
        }
        document.getElementById("statLiveUsers").innerText = liveCount;
      });
    }

    function resellerGenKey() {
      if(resellerCredits < 1) return alert("Insufficient Credits!");
      const k = document.getElementById("rCustomKey").value.trim() || "RES-" + Math.random().toString(36).substr(2, 8).toUpperCase();
      const pol = document.getElementById("rPolicy").value;
      const val = parseFloat(document.getElementById("rCustomNum").value) || 1;
      const unit = document.getElementById("rCustomUnit").value;

      let sec = val;
      if (unit === "minutes") sec = val * 60;
      else if (unit === "hours") sec = val * 3600;
      else if (unit === "days") sec = val * 86400;
      else if (unit === "months") sec = val * 30 * 86400;
      else if (unit === "years") sec = val * 365 * 86400;

      db.ref("DEATHPORTAL/" + k).set({
        deviceType: pol, durationSeconds: Math.round(sec), durationText: `${val} ${unit}`,
        startTime: 0, expireTime: 0, boundDevice: "Unregistered",
        isFrozen: false, createdBy: loggedReseller
      }).then(() => {
        resellerCredits--;
        db.ref("RESELLERS/" + loggedReseller).update({ credits: resellerCredits });
        alert("Key Generated: " + k);
        document.getElementById("rCustomKey").value = "";
      }).catch(err => alert(err.message));
    }

    function toggleFreeze(key, freezeStatus) {
      db.ref("DEATHPORTAL/" + key).update({ isFrozen: freezeStatus });
    }

    function deleteResellerKey(key, durationText) {
      if(confirm("Delete key: " + key + "?")) {
        db.ref("DEATHPORTAL/" + key).remove().then(() => {
          db.ref("RESELLER_DELETED_KEYS/" + loggedReseller).push({
            key: key, durationText: durationText, deletedAt: Date.now()
          });
        });
      }
    }

    // ব্যাকগ্রাউন্ড ক্যানভাস
    const canvas = document.getElementById("fxCanvas");
    const ctx = canvas.getContext("2d");
    let width = canvas.width = window.innerWidth, height = canvas.height = window.innerHeight;
    let particles = [];
    for(let i=0; i<30; i++) particles.push({ x: Math.random()*width, y: Math.random()*height, speed: Math.random()*3+1 });
    function loop() {
      ctx.clearRect(0,0,width,height);
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary-color');
      particles.forEach(p => {
        p.y += p.speed; if(p.y > height) p.y = 0;
        ctx.fillRect(p.x, p.y, 2, 8);
      });
      requestAnimationFrame(loop);
    }
    loop();

    db.ref("APP_THEME").on("value", snapshot => {
      if (snapshot.exists()) {
        const theme = snapshot.val();
        document.documentElement.style.setProperty('--primary-color', theme.color || "#00d2d3");
        document.documentElement.style.setProperty('--glow-color', (theme.color || "#00d2d3") + "66");
      }
    });
  </script>
</body>
</html>
